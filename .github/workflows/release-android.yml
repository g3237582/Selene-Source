name: Release Android APKs

on:
  push:
    tags:
      - 'v*'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      # android/app/build.gradle.kts reads android/key.properties (rootProject)
      # and resolves storeFile relative to android/app/.
      # Missing secrets must fail the job — do not fall back to debug signing.
      - name: Configure Android release signing
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || \
             [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${ANDROID_KEY_ALIAS:-}" ] || \
             [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Missing Android release signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Refusing to fall back to debug signing."
            exit 1
          fi
          printf '%s\n' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "Decoded keystore is empty. Check ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "upload-keystore.jks"
          } > android/key.properties

      - name: Build split APKs
        run: |
          flutter build apk --release \
            --android-skip-build-dependency-validation \
            --target-platform android-arm64,android-arm \
            --split-per-abi

      - name: Package artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/selene-${VERSION}-armv7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/selene-${VERSION}-armv8.apk"
          ls -lh dist

      # Real per-version notes: GitHub generate-notes since the previous v* tag,
      # then a short stable install footer. Do not reuse a static feature list.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          git fetch --force --tags

          PREV_TAG="$(git tag -l 'v*' --sort=-v:refname | awk -v cur="$TAG" '$0 != cur { print; exit }')"
          echo "Current tag: ${TAG}"
          echo "Previous tag: ${PREV_TAG:-<none>}"

          api_args=(
            --method POST
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes"
            -f tag_name="$TAG"
            -f target_commitish="${GITHUB_SHA}"
          )
          if [ -n "${PREV_TAG:-}" ]; then
            api_args+=(-f previous_tag_name="$PREV_TAG")
          fi

          NOTES=""
          if NOTES="$(gh api "${api_args[@]}" --jq .body)" && [ -n "${NOTES}" ]; then
            echo "Using GitHub-generated release notes."
          else
            echo "GitHub generate-notes API failed or returned empty; falling back to git log." >&2
            if [ -n "${PREV_TAG:-}" ]; then
              RANGE="${PREV_TAG}..HEAD"
            else
              RANGE="HEAD"
            fi
            NOTES="$(git log --pretty=format:'- %s' "$RANGE")"
          fi

          {
            printf 'Selene %s\n\n' "$TAG"
            printf '%s\n\n' "$NOTES"
            cat <<'EOF'
          **安装说明**
          - 手机优先下载 `selene-*-armv8.apk`
          - 本仓库 Releases 使用稳定发布签名，后续本仓库更新可直接覆盖安装。
          - 若当前已装的是旧的调试签名包或其他签名包，首次切换到新签名时仍需先卸载一次。
          EOF
          } > release-notes.md

          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Selene ${{ github.ref_name }}
          files: dist/*.apk
          body_path: release-notes.md
